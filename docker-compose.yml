services:
  api:
    build: .
    env_file: .env
    environment:
      ONBOARDIQ_DATABASE_URL: postgresql+asyncpg://onboardiq:onboardiq@postgres:5432/onboardiq
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: onboardiq
      POSTGRES_PASSWORD: onboardiq
      POSTGRES_DB: onboardiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboardiq -d onboardiq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
