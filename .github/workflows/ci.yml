name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Test (pytest, coverage gate 85%)
        run: uv run pytest --cov

      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-groups > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t onboardiq:ci .
